# /etc/nginx/sites-available/husky  (симлинк в sites-enabled)
#
# Здесь только http. Блок https, сертификаты и редирект добавит certbot:
#   certbot --nginx -d ТВОЁ-ИМЯ
# Ему нужен именно такой 80-й блок с нужным server_name, иначе он не найдёт,
# куда вписываться.
server {
    listen 80;
    listen [::]:80;
    server_name husky-mark.duckdns.org;

    # html игры весит ~140 КБ, жмём
    gzip on;
    gzip_types text/html text/css application/javascript application/json;

    # сюда Telegram шлёт апдейты бота, сюда же ходит мини-приложение за прогрессом
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
